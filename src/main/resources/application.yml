spring:
  application:
    name: cinemat

  # Mặc định chạy H2 (in-memory) để dev nhanh, không cần cài DB.
  # Chạy với MySQL: --spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:mem:cinemadb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${PORT:8080}

app:
  jwt:
    # >= 32 ký tự. Khi deploy hãy đặt biến môi trường JWT_SECRET.
    secret: ${JWT_SECRET:cinemat-super-secret-key-change-me-0123456789abcdef}
    expiration-ms: 86400000   # 24 giờ

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    vn.edu.cinema.aspect: DEBUG
