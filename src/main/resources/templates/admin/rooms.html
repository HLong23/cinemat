<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý phòng chiếu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <h1 class="h4 mb-3">Quản lý phòng chiếu</h1>

    <form th:action="@{/admin/rooms}" th:object="${form}" method="post" class="card card-body shadow-sm mb-4" novalidate>
        <h2 class="h6" th:text="*{id == null} ? 'Thêm phòng mới' : 'Sửa phòng #' + *{id}">Thêm phòng</h2>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <label class="form-label" for="cinemaId">Rạp</label>
                <select class="form-select" id="cinemaId" th:field="*{cinemaId}" th:errorclass="is-invalid">
                    <option value="">-- Chọn rạp --</option>
                    <option th:each="c : ${cinemas}" th:value="${c.id}" th:text="${c.name}">Rạp</option>
                </select>
                <div class="invalid-feedback" th:errors="*{cinemaId}"></div>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label" for="name">Tên phòng</label>
                <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="numRows">Số hàng</label>
                <input class="form-control" id="numRows" type="number" th:field="*{numRows}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{numRows}"></div>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="seatsPerRow">Ghế / hàng</label>
                <input class="form-control" id="seatsPerRow" type="number" th:field="*{seatsPerRow}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{seatsPerRow}"></div>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-danger">Lưu</button>
            <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary">Làm mới</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-light"><tr><th>#</th><th>Rạp</th><th>Phòng</th><th>Sơ đồ ghế</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${rooms}">
                <td th:text="${r.id}">1</td>
                <td th:text="${r.cinema.name}">Rạp</td>
                <td th:text="${r.name}">Phòng 1</td>
                <td><span th:text="${r.numRows}">8</span> hàng × <span th:text="${r.seatsPerRow}">10</span> ghế
                    (<span th:text="${r.numRows * r.seatsPerRow}">80</span>)</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rooms(edit=${r.id})}">Sửa</a>
                    <form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                          data-confirm="Xoá phòng này?">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
