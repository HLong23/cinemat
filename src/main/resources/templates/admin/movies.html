<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý phim')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <h1 class="h4 mb-3">Quản lý phim</h1>

    <form th:action="@{/admin/movies}" th:object="${movie}" method="post" class="card card-body shadow-sm mb-4" novalidate>
        <h2 class="h6" th:text="*{id == null} ? 'Thêm phim mới' : 'Sửa phim #' + *{id}">Thêm phim</h2>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="title">Tên phim</label>
                <input class="form-control" id="title" th:field="*{title}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="genre">Thể loại</label>
                <input class="form-control" id="genre" th:field="*{genre}" th:errorclass="is-invalid">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="durationMinutes">Thời lượng (phút)</label>
                <input class="form-control" id="durationMinutes" type="number" th:field="*{durationMinutes}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="releaseDate">Ngày khởi chiếu</label>
                <input class="form-control" id="releaseDate" type="date" th:field="*{releaseDate}">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="posterUrl">Link poster (tuỳ chọn)</label>
                <input class="form-control" id="posterUrl" th:field="*{posterUrl}">
            </div>
            <div class="col-12">
                <label class="form-label" for="description">Mô tả</label>
                <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                    <label class="form-check-label" for="active">Đang chiếu (hiển thị cho khách)</label>
                </div>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-danger">Lưu</button>
            <a th:href="@{/admin/movies}" class="btn btn-outline-secondary">Làm mới</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-light">
            <tr><th>#</th><th>Tên phim</th><th>Thể loại</th><th>Phút</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movies}">
                <td th:text="${m.id}">1</td>
                <td th:text="${m.title}">Tên</td>
                <td th:text="${m.genre}">Thể loại</td>
                <td th:text="${m.durationMinutes}">120</td>
                <td><span class="badge" th:classappend="${m.active} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${m.active} ? 'Đang chiếu' : 'Ẩn'">Đang chiếu</span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/movies(edit=${m.id})}">Sửa</a>
                    <form th:action="@{/admin/movies/{id}/delete(id=${m.id})}" method="post" class="d-inline"
                          data-confirm="Xoá phim này?">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
