<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý rạp')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <h1 class="h4 mb-3">Quản lý rạp</h1>

    <form th:action="@{/admin/cinemas}" th:object="${cinema}" method="post" class="card card-body shadow-sm mb-4" novalidate>
        <h2 class="h6" th:text="*{id == null} ? 'Thêm rạp mới' : 'Sửa rạp #' + *{id}">Thêm rạp</h2>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-12 col-md-5">
                <label class="form-label" for="name">Tên rạp</label>
                <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-12 col-md-7">
                <label class="form-label" for="address">Địa chỉ</label>
                <input class="form-control" id="address" th:field="*{address}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{address}"></div>
            </div>
        </div>
        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-danger">Lưu</button>
            <a th:href="@{/admin/cinemas}" class="btn btn-outline-secondary">Làm mới</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-light"><tr><th>#</th><th>Tên rạp</th><th>Địa chỉ</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${cinemas}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Tên</td>
                <td th:text="${c.address}">Địa chỉ</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/cinemas(edit=${c.id})}">Sửa</a>
                    <form th:action="@{/admin/cinemas/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                          data-confirm="Xoá rạp này?">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
