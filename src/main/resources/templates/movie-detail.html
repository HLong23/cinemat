<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${movie.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-12 col-md-4">
            <div class="poster-lg shadow-sm">
                <img th:if="${movie.posterUrl != null and !movie.posterUrl.isBlank()}" th:src="${movie.posterUrl}"
                     th:alt="${movie.title}" class="poster">
                <div th:unless="${movie.posterUrl != null and !movie.posterUrl.isBlank()}" class="poster-placeholder"
                     th:text="${#strings.substring(movie.title, 0, 1)}">A</div>
            </div>
        </div>
        <div class="col-12 col-md-8">
            <h1 class="h2" th:text="${movie.title}">Tên phim</h1>
            <dl class="row">
                <dt class="col-5 col-sm-3" th:text="#{movie.genre}">Thể loại</dt>
                <dd class="col-7 col-sm-9" th:text="${movie.genre}">...</dd>
                <dt class="col-5 col-sm-3" th:text="#{movie.duration}">Thời lượng</dt>
                <dd class="col-7 col-sm-9"><span th:text="${movie.durationMinutes}">120</span> <span th:text="#{movie.minutes}">phút</span></dd>
                <dt class="col-5 col-sm-3" th:text="#{movie.release}">Khởi chiếu</dt>
                <dd class="col-7 col-sm-9" th:text="${movie.releaseDate != null} ? ${#temporals.format(movie.releaseDate, 'dd/MM/yyyy')} : '-'">...</dd>
            </dl>
            <p th:text="${movie.description}">Mô tả</p>

            <h2 class="h5 mt-4" th:text="#{movie.showtimes}">Suất chiếu sắp tới</h2>
            <p class="text-muted" th:if="${showtimes.isEmpty()}" th:text="#{movie.noShowtimes}">Chưa có suất chiếu.</p>
            <div class="list-group" th:unless="${showtimes.isEmpty()}">
                <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2"
                     th:each="s : ${showtimes}">
                    <div>
                        <div class="fw-semibold" th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy HH:mm')}">Giờ</div>
                        <div class="small text-muted">
                            <span th:text="${s.room.cinema.name}">Rạp</span> -
                            <span th:text="#{movie.room}">Phòng</span> <span th:text="${s.room.name}">1</span> -
                            <span th:text="${#numbers.formatInteger(s.price, 0, 'POINT')}">90.000</span> <span th:text="#{common.currency}">đ</span>
                        </div>
                    </div>
                    <a th:href="@{/showtimes/{id}/seats(id=${s.id})}" class="btn btn-sm btn-danger"
                       th:text="#{movie.book}">Chọn ghế</a>
                </div>
            </div>
            <a th:href="@{/}" class="btn btn-link px-0 mt-3" th:text="#{common.back}">Quay lại</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
