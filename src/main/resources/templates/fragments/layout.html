<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Phần <head> dùng chung: truyền tiêu đề trang vào tham số title -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Cinemat'">Cinemat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>
<!-- Thanh điều hướng dùng chung: có nút đổi ngôn ngữ (?lang=vi|en, lưu vào cookie "lang") -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎬 <span>Cinemat</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.home}">Trang chủ</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/bookings}" th:text="#{nav.bookings}">Vé của tôi</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false" th:text="#{nav.admin}">Quản trị</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin}">Tổng quan</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/movies}">Phim</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/cinemas}">Rạp</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/rooms}">Phòng chiếu</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/showtimes}">Suất chiếu</a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="btn-group btn-group-sm" role="group" aria-label="Language">
                    <a href="?lang=vi" class="btn btn-outline-light" th:classappend="${#locale.language == 'vi'} ? 'active'">VI</a>
                    <a href="?lang=en" class="btn btn-outline-light" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
                </div>
                <th:block sec:authorize="isAuthenticated()">
                    <span class="text-light small">
                        <span th:text="#{nav.hello}">Xin chào</span>,
                        <strong sec:authentication="name">user</strong>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{nav.logout}">Đăng xuất</button>
                    </form>
                </th:block>
                <th:block sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/login}" th:text="#{nav.login}">Đăng nhập</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/register}" th:text="#{nav.register}">Đăng ký</a>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<!-- Thông báo flash (success/error) -->
<div th:fragment="flash" class="container mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${success != null}">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error != null}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="bg-dark text-light-emphasis py-3 mt-5">
    <div class="container small text-center text-secondary">© Cinemat - Spring Boot demo</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form có data-confirm sẽ hỏi xác nhận trước khi gửi.
        document.querySelectorAll('form[data-confirm]').forEach(function (f) {
            f.addEventListener('submit', function (e) {
                if (!window.confirm(f.dataset.confirm)) { e.preventDefault(); }
            });
        });
    </script>
</footer>
</body>
</html>
